# Flywheel project config. Read by the MCP server at runtime.
# Schema is hand-edited — keys are flat and additive; unknown keys are ignored.

convergence:
  gate_advance_wave: true

# Cursor deep-plan: one model per parallel planner (Task tool `model` arg).
deep_plan:
  correctness: opus-4.6
  ergonomics: composer-2.5
  robustness: gpt-5.5-xhigh
  synthesis: opus-4.6

# Cursor implement swarm: Task model per bead complexity (simple/medium/complex).
implement:
  simple: composer-2.5
  medium: gpt-5.5-xhigh
  complex: opus-4.6

# Impl supervision loop (flywheel_impl_tick): fresh-eyes batch review cadence.
impl_tick:
  interval_seconds: 240
  commit_batch_threshold: 5
  auto_loop: true
  auto_batch_review: true
  final_on_drain: true

# Cursor dueling idea wizards: one model per wizard + synthesis Task.
duel:
  wizard_a: opus-4.6
  wizard_b: gpt-5.5-xhigh
  wizard_c: composer-2.5
  synthesis: opus-4.6

# Scoped vs full-suite test policy during parallel implement waves.
verify:
  test_cwd: plugins/cursor-orchestrator/mcp-server
  build_slot: npm-test
  max_workers: 2
  allow_full_suite_when_alone: true

# Cursor swarm: single shared branch + Agent Mail file reservations (no worktrees).
coordination:
  mode: single-branch
